<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Biblioteca - Eroticpad</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container-biblioteca">
    <h2>📚 Minha Biblioteca</h2>

    <!-- Abas de Navegação -->
    <div class="tabs-biblioteca">
      <button class="tab-btn active" onclick="filtrarBiblioteca('lendo')">📖 Lendo</button>
      <button class="tab-btn" onclick="filtrarBiblioteca('favorito')">❤️ Favoritos</button>
      <button class="tab-btn" onclick="filtrarBiblioteca('para_ler')">🔖 Para Ler</button>
      <button class="tab-btn" onclick="filtrarBiblioteca('concluido')">✅ Concluídos</button>
    </div>

    <!-- Container dos Cards -->
    <div id="grid-livros" class="grid-livros">
      <p>Carregando sua biblioteca...</p>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Carrega os livros assim que a página abre
    document.addEventListener('DOMContentLoaded', () => {
      carregarBiblioteca('lendo');
    });
  </script>
</body>
</html>
